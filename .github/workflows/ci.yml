# QuietKey / CloakVault reference-implementation CI.
# Runs the same three validations used during development, in full.
# No suite may be reduced, sampled, or shortcut. No continue-on-error.
name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    name: TypeScript typecheck + full 97-test vitest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1 # matches pnpm-lock.yaml (lockfileVersion 9.0)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @workspace/cloakvault run typecheck
      - name: Full vitest suite (97 tests, never a subset)
        run: pnpm --filter @workspace/cloakvault run test

  python-interop:
    name: Python interop suite (12 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install cryptography pytest
      - name: Run interop suite
        run: pytest artifacts/cloakvault/interop/python -q

  cross-implementation:
    name: Cross-implementation check (TS ⇄ Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create the interop venv the cross-check script expects
        # scripts/interop-check.ts invokes interop/python/.venv/bin/python;
        # that venv is untracked, so CI must create it at the exact path.
        run: |
          python -m venv artifacts/cloakvault/interop/python/.venv
          artifacts/cloakvault/interop/python/.venv/bin/pip install cryptography
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Cross-implementation interop check
        run: pnpm --filter @workspace/cloakvault run interop:cross
